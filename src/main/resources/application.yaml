spring:
  application:
    name: notification-engine

  datasource:
    url: jdbc:mysql://localhost:3306/notification_engine
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
  redis:
    host: localhost
    port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${NOTIFICATION_KAFKA_TOPIC:notification-events}


ratelimit:
  per-minute:
    10
  
environment:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
