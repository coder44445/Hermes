spring:
  application:
    name: notification-engine

  datasource:
    url: jdbc:mysql://localhost:3306/notification_engine
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
  redis:
    host: localhost
    port: 6379

logging:
  file:
    name: logs/notification-engine.log    # main log file
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  # console format
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"     # file format
  level:
    root: INFO                          # default log level
    org.springframework: INFO            # Spring framework logs
    org.hibernate.SQL: DEBUG             # SQL statements
    org.springframework.kafka: DEBUG     # Kafka debug logs

ratelimit:
  per-minute:
    10