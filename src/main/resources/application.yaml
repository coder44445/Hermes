spring:
  application:
    name: notification-engine

  datasource:
    url: jdbc:mysql://localhost:3306/notification_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest

notification:
  kafka:
    topic: ${NOTIFICATION_KAFKA_TOPIC:notification-events}

logging:
  file:
    name: logs/notification-engine.log    # main log file
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  # console format
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"     # file format
  level:
    root: INFO                          # default log level
    org.springframework: INFO            # Spring framework logs
    org.hibernate.SQL: DEBUG             # SQL statements
    org.springframework.kafka: DEBUG     # Kafka debug logs

ratelimit:
  per-minute: 10
