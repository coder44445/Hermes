spring:
  application:
    name: notification-engine

  datasource:
    url: jdbc:mysql://localhost:3306/notification_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest

notification:
  kafka:
    topic: ${NOTIFICATION_KAFKA_TOPIC:notification-events}

ratelimit:
  per-minute: 10
